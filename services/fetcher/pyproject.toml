[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nti-fetcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "nti-core",
  "nti-engine",
  "httpx>=0.28.0",
  "twscrape>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nti_fetcher"]
