name: Deploy NTI to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-vps:
    name: Sync & Reload VPS Services
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "VPS secrets not configured; skipping VPS deploy."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Keep alert & MiMo LLM credentials synced in the VPS .env (sent over stdin, never on a command line).
          {
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n' "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID"
            fi
            if [ -n "$MIMO_API_KEY" ]; then
              printf 'MIMO_API_KEY=%s\nMIMO_API_BASE_URL=https://token-plan-sgp.xiaomimimo.com/v1\nMIMO_MODEL=mimo-v2.6-pro\n' "$MIMO_API_KEY"
            fi
          } | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            'f=/home/ubuntu/apps/nti/.env; touch "$f"; while IFS= read -r line; do [ -z "$line" ] && continue; k=${line%%=*}; { grep -v "^$k=" "$f" || true; } > "$f.tmp"; printf "%s\n" "$line" >> "$f.tmp"; mv "$f.tmp" "$f"; done; chmod 600 "$f"'
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "${VPS_USER}@${VPS_HOST}" \
            "export PATH=\$HOME/.local/bin:\$PATH; cd /home/ubuntu/apps/nti && git config core.fileMode false && { git diff --quiet || git stash push -q -m pre-deploy-\$(date +%s); } && bash infra/scripts/deploy-vps.sh"
