[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# Exact (perfect) verification on Sourcify and Blockscout needs the metadata hash inside the bytecode.
bytecode_hash = "ipfs"
cbor_metadata = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
  { access = "read-write", path = "../packages/sdk" },
  { access = "read-write", path = "deployments" },
  { access = "read", path = "../config" },
]

[fuzz]
runs = 1000
max_test_rejects = 65536

[invariant]
runs = 256
depth = 64
fail_on_revert = true

[rpc_endpoints]
robinhood_mainnet = "${RPC_URL_MAINNET}"
robinhood_testnet = "${RPC_URL_TESTNET}"
